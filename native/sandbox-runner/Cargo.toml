[package]
name = "caelush-sandbox-runner"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Test-only fault injection for the Windows restricted-spawn sequence. The release build
# (`scripts/build-sandbox-runner.mjs` and the release pipeline) never enables it, so the shipped
# Runner contains neither the hook call sites nor the environment reader — see
# `packages/runtime/test/windows-sandbox-faults.e2e.test.ts`, which asserts that directly.
test-fault-injection = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_JobObjects",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[[bin]]
name = "caelush-sandbox-runner"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
