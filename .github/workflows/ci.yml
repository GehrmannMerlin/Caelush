name: CI

on:
  push:
  pull_request:

jobs:
  # Runs first and gates everything else. Deliberately cheap: no browser, no
  # release artifact, no business test suite. An architecture violation should
  # fail before the expensive jobs start.
  #
  # Checkout depth: the default depth is sufficient. The architecture scripts
  # shell out to git for exactly three read-only, checkout-local queries —
  # `rev-parse HEAD`, `log -1 --format=%cI`, and
  # `status --porcelain -- packages apps` — and never call `git show`,
  # `git cat-file` or `git merge-base`. `--verify-baseline` compares the
  # recorded baselineSourceCommit string against the metadata of the checked-in
  # file; it never dereferences that commit, so full history is not needed.
  architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm@11.21.0 install --frozen-lockfile

      - name: Run architecture gate
        run: corepack pnpm@11.21.0 check:architecture:ci

      - name: Run architecture tests
        run: corepack pnpm@11.21.0 exec vitest run tests/architecture

  check:
    needs:
      - architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm@11.21.0 install --frozen-lockfile

      - name: Install Chromium for browser E2E
        run: corepack pnpm@11.21.0 exec playwright install --with-deps chromium

      - name: Run production browser E2E
        run: corepack pnpm@11.21.0 test:web:e2e

      - name: Run quality gate
        run: corepack pnpm@11.21.0 run check

  release-smoke:
    needs:
      - architecture
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-x64
          - os: macos-14
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}
    name: release-smoke (${{ matrix.label }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm@11.21.0 install --frozen-lockfile

      - name: Run source verification
        run: |
          corepack pnpm@11.21.0 check:architecture
          corepack pnpm@11.21.0 lint
          corepack pnpm@11.21.0 typecheck
          corepack pnpm@11.21.0 test
          corepack pnpm@11.21.0 build

      - name: Build platform release artifact
        run: corepack pnpm@11.21.0 build:release

      - name: Run artifact-only E2E
        run: corepack pnpm@11.21.0 test:release

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: caelush-${{ matrix.label }}
          path: release-artifacts/*
          if-no-files-found: error
