name: CI

on:
  push:
  pull_request:

jobs:
  # Runs first and gates everything else. Deliberately cheap: no browser, no
  # release artifact, no business test suite. An architecture violation should
  # fail before the expensive jobs start.
  #
  # Checkout depth: the default depth is sufficient. The architecture scripts
  # shell out to git for exactly three read-only, checkout-local queries —
  # `rev-parse HEAD`, `log -1 --format=%cI`, and
  # `status --porcelain -- packages apps` — and never call `git show`,
  # `git cat-file` or `git merge-base`. `--verify-baseline` compares the
  # recorded baselineSourceCommit string against the metadata of the checked-in
  # file; it never dereferences that commit, so full history is not needed.
  # The separate OpenAPI PR step fetches only the target commit and reads only
  # the prior contract file; Main pushes run structural validation without a
  # historical compatibility comparison.
  architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Check product version authority
        run: node scripts/check-product-version.mjs

      - name: Validate Cloud OpenAPI structure
        run: node scripts/contracts/check-cloud-openapi.mjs

      - name: Compare Cloud OpenAPI with pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          contract_path="docs/architecture/desktop/cloud-api-v1.openapi.json"
          if git cat-file -e "FETCH_HEAD:$contract_path" 2>/dev/null; then
            git show "FETCH_HEAD:$contract_path" > "$RUNNER_TEMP/cloud-api-v1-baseline.json"
            node scripts/contracts/check-cloud-openapi.mjs \
              --candidate "$contract_path" \
              --baseline "$RUNNER_TEMP/cloud-api-v1-baseline.json"
          else
            echo "::notice::The PR base has no Cloud OpenAPI contract yet; structural validation ran, historical comparison is skipped."
          fi

      - name: Run repository hygiene gate
        run: node scripts/check-repository-hygiene.mjs

      - name: Install dependencies
        run: corepack pnpm@11.21.0 install --frozen-lockfile

      # The contract tests below import `@caelush/protocol` and `@caelush/client` through their
      # package entry points, which resolve to `dist`. Without this step the job fails on module
      # resolution before it has checked a single contract, and the architecture gate behind it is
      # skipped — a red that says nothing about architecture. The closure is built explicitly rather
      # than relying on step order.
      - name: Build the contract dependency closure
        run: >-
          corepack pnpm@11.21.0 -r
          --filter "@caelush/protocol..."
          --filter "@caelush/client..."
          --if-present run build

      - name: Run contract tests
        run: >-
          corepack pnpm@11.21.0 exec vitest run tests/contracts
          packages/client/test/desktop-compatibility.test.ts
          packages/protocol/test/desktop-capabilities.test.ts

      - name: Run architecture gate
        run: corepack pnpm@11.21.0 check:architecture:ci

      - name: Run architecture tests
        run: corepack pnpm@11.21.0 exec vitest run tests/architecture

  # The reliability gate for the Tool-preparation, failed-history, diagnostics, plan-evidence and
  # feedback paths. Deliberately independent of `architecture`: a red architecture baseline must not
  # hide whether these paths still work, and this job passing must never be read as the whole
  # workflow passing — the architecture gate stays the repository-wide gate.
  #
  # Both hosts run it because the failures these tests cover are host-shaped: Windows path handling,
  # process exit codes and PowerShell wrapping are where the original defects surfaced.
  #
  # Build closure: `@caelush/daemon` and `@caelush/client` are imported from `dist` by these tests, so
  # their dependency closures must exist before vitest runs. Skipping that step is the same failure
  # the contract tests hit when `dist` was missing.
  reliability:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    name: reliability (${{ matrix.os }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm@11.21.0 install --frozen-lockfile

      - name: Build the composition and client dependency closures
        run: >-
          corepack pnpm@11.21.0 -r
          --filter "@caelush/daemon..."
          --filter "@caelush/client..."
          --if-present run build

      - name: Record the environment under test
        shell: bash
        run: |
          mkdir -p reliability-results
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "node=$(node -v)"
            echo "pnpm=$(corepack pnpm@11.21.0 --version)"
            echo "runner=${{ matrix.os }}"
          } | tee reliability-results/environment.txt

      # The projector suite is excluded on purpose: it carries a pre-existing failure
      # (`run.input.accepted` has no projection fixture) that predates this work and is unrelated to
      # it. The diagnostics assertions added to it still run under `pnpm test` in the `check` job.
      # Fixing that fixture here would mean editing a baseline expectation to manufacture a green
      # gate, which this job must not do.
      - name: Run the reliability paths
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm@11.21.0 exec vitest run \
            --pool=forks --maxWorkers=1 --testTimeout=600000 \
            packages/coding-agent/test/apply-patch-arguments.test.ts \
            packages/coding-agent/test/coding-tool-catalog.test.ts \
            packages/ai/test/received-tool-request.test.ts \
            packages/ai/test/adapters/openai-compatible/rejected-replay.test.ts \
            packages/agent/test/tools-call-preparation.test.ts \
            packages/agent/test/tool-batch-coordinator.test.ts \
            apps/daemon/test/coding-tool-scheduling-facts.test.ts \
            apps/daemon/test/agent-continuity-s1-e2e.test.ts \
            apps/daemon/test/ai-context-summarizer-adapter.test.ts \
            apps/daemon/test/invalid-tool-request-feedback-e2e.test.ts \
            apps/daemon/test/patch-normalization-e2e.test.ts \
            apps/daemon/test/tool-composition-delegation.test.ts \
            apps/daemon/test/reliability-control-e2e.test.ts \
            apps/daemon/test/failed-tool-history-continuation.test.ts \
            packages/storage/test/interrupted-history-closure.test.ts \
            packages/agent/test/messages/interrupted-tool-batch-reconciler.test.ts \
            apps/daemon/test/run-failure-diagnostics.test.ts \
            apps/daemon/test/session-presentation-service.test.ts \
            packages/coding-agent/test/task-plan-evidence.test.ts \
            packages/coding-agent/test/task-plan-semantic-budget.test.ts \
            apps/daemon/test/task-plan-context.test.ts \
            apps/daemon/test/task-plan-evidence-e2e.test.ts \
            apps/daemon/test/task-plan-feedback-e2e.test.ts \
            apps/daemon/test/reliability-feedback-e2e.test.ts \
            2>&1 | tee reliability-results/vitest.log

      # The Context half of the same gate. These are separate from the list above because they assert a
      # different failure vocabulary: a Run that cannot prepare its context must fail with a bounded,
      # classifiable reason on a real daemon composition, not with a bare `RangeError` the presentation
      # layer has to guess at. `context-budget-default-policy` is here for the same reason the long-run
      # job exists: a policy default is only real if the create-run route produces it.
      - name: Run the Context preparation and capacity paths
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm@11.21.0 exec vitest run \
            --pool=forks --maxWorkers=1 --testTimeout=600000 \
            packages/core/test/run-context-preparation-diagnostic.test.ts \
            apps/daemon/test/context-preparation-failure-e2e.test.ts \
            apps/daemon/test/public-event-context-preparation.test.ts \
            apps/daemon/test/context-budget-default-policy.test.ts \
            apps/daemon/test/context-surface-churn.test.ts \
            packages/storage/test/prompt-surface-rollover-production.test.ts \
            2>&1 | tee reliability-results/context-vitest.log

      - name: Upload the reliability results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-${{ matrix.os }}
          path: reliability-results/*
          if-no-files-found: error

  # The long-run layer of the same gate, and a different question from the job above.
  #
  # `reliability` asks whether a specific defect is still present. This job asks whether a Run that is
  # simply *long* stays correct: ordered Tool history, a bounded request, an intact epoch chain, and
  # durable compaction under the default policy or an intact capacity rollover under the legacy one.
  #
  # Both policies run because they bound different things, and a green default policy must never be
  # read as a green rollover path — the production defect these tests exist for survived a 250-step
  # suite precisely because that suite only ever exercised the compacting path. 250 and 400 therefore
  # each appear twice, once per policy; the mapping below is enumerated rather than generated so no
  # combination can be lost to an `exclude:` rule, and `fail-fast: false` keeps one slow failure from
  # hiding the other nine.
  #
  # What a green run here does NOT mean: that a model completes a complex task. Every Step is scripted
  # by step number, so a Run that recovered correctly and a Run that ignored all feedback reach the
  # same status. The real-model layer is `scripts/reliability-real-model-eval.mjs`; it needs a
  # configured provider, a fixed task set and a budget, it never runs in CI, and its honest value is
  # `NOT_RUN` until someone runs it.
  reliability-long-run:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The short end. Both bounds are already crossed by 75 Steps — the default policy compacts,
          # the legacy policy rolls over — so a regression surfaces without waiting for the long cases.
          - os: ubuntu-latest
            label: linux-075-default
            steps: 75
            policy: default
          - os: windows-latest
            label: windows-075-legacy
            steps: 75
            policy: legacy
          # The record-boundary neighbourhood: 130 Steps is just past the historical 128-record epoch,
          # which is where a broken rollover used to be invisible.
          - os: ubuntu-latest
            label: linux-130-legacy
            steps: 130
            policy: legacy
          - os: windows-latest
            label: windows-130-default
            steps: 130
            policy: default
          # 250 and 400: each policy, on the host where its failure mode was originally observed.
          - os: ubuntu-latest
            label: linux-250-default
            steps: 250
            policy: default
          - os: ubuntu-latest
            label: linux-250-legacy
            steps: 250
            policy: legacy
          - os: windows-latest
            label: windows-250-legacy
            steps: 250
            policy: legacy
          - os: ubuntu-latest
            label: linux-400-default
            steps: 400
            policy: default
          - os: ubuntu-latest
            label: linux-400-legacy
            steps: 400
            policy: legacy
          - os: windows-latest
            label: windows-400-default
            steps: 400
            policy: default
    runs-on: ${{ matrix.os }}
    name: reliability-long-run (${{ matrix.label }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm@11.21.0 install --frozen-lockfile

      - name: Build the composition dependency closure
        run: >-
          corepack pnpm@11.21.0 -r
          --filter "@caelush/daemon..."
          --if-present run build

      - name: Record the environment under test
        shell: bash
        run: |
          mkdir -p reliability-long-run
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "node=$(node -v)"
            echo "pnpm=$(corepack pnpm@11.21.0 --version)"
            echo "runner=${{ matrix.os }}"
            echo "steps=${{ matrix.steps }}"
            echo "policy=${{ matrix.policy }}"
          } | tee reliability-long-run/environment.txt

      - name: Run the long-run acceptance
        shell: bash
        env:
          CAELUSH_LONGRUN_STEPS: ${{ matrix.steps }}
          CAELUSH_LONGRUN_POLICY: ${{ matrix.policy }}
          CAELUSH_RELIABILITY_METRICS_PATH: reliability-long-run/metrics.json
        run: |
          set -o pipefail
          corepack pnpm@11.21.0 exec vitest run \
            --pool=forks --maxWorkers=1 --testTimeout=1800000 \
            apps/daemon/test/context-long-run-matrix-e2e.test.ts \
            2>&1 | tee reliability-long-run/vitest.log

      # A skipped or filtered suite also exits zero, and a job that measured nothing must not report a
      # pass. The metrics file is written by the test after its durable assertions, so its absence is
      # the honest signal that the Run did not finish the acceptance.
      - name: Verify the Run that was actually measured
        shell: bash
        env:
          EXPECTED_STEPS: ${{ matrix.steps }}
          EXPECTED_POLICY: ${{ matrix.policy }}
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "reliability-long-run/metrics.json";
            if (!fs.existsSync(path)) {
              console.error("::error::No metrics file: the long-run acceptance did not run.");
              process.exit(1);
            }
            const metrics = JSON.parse(fs.readFileSync(path, "utf8"));
            const problems = [];
            if (String(metrics.steps) !== String(process.env.EXPECTED_STEPS)) {
              problems.push(`steps=${metrics.steps} != ${process.env.EXPECTED_STEPS}`);
            }
            if (metrics.policy !== process.env.EXPECTED_POLICY) {
              problems.push(`policy=${metrics.policy} != ${process.env.EXPECTED_POLICY}`);
            }
            if (metrics.mainModelRequests !== metrics.steps) {
              problems.push(`requests=${metrics.mainModelRequests} != steps=${metrics.steps}`);
            }
            if (problems.length > 0) {
              console.error(`::error::${problems.join("; ")}`);
              process.exit(1);
            }
            console.log(
              `${metrics.steps} steps, ${metrics.policy} policy: ` +
                `${metrics.mainModelRequests} requests, ${metrics.compactionCalls} compactions, ` +
                `${metrics.epochs} epochs (${metrics.resetReasons.join(", ")}).`,
            );
          '

      # One line per verification layer, so the artifact says what it is evidence for. A reader who
      # finds this file must not have to infer that a green infrastructure job says nothing about a
      # model's ability to finish a complex task.
      - name: Record what this job measured and what it did not
        if: always()
        shell: bash
        run: |
          {
            echo "INFRASTRUCTURE_CAPACITY status=${{ job.status }} steps=${{ matrix.steps }} policy=${{ matrix.policy }} host=${{ matrix.os }}"
            echo "FEEDBACK_PATH status=MEASURED_BY THE reliability JOB (failures, corrections, plan feedback)"
            echo "REAL_MODEL_ADAPTATION status=NOT_RUN reason=needs a configured provider, a fixed task set and a budget"
          } | tee reliability-long-run/verdict.txt

      - name: Upload the long-run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-long-run-${{ matrix.label }}
          path: reliability-long-run/*
          if-no-files-found: error

  check:
    needs:
      - architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm@11.21.0 install --frozen-lockfile

      - name: Install Chromium for browser E2E
        run: corepack pnpm@11.21.0 exec playwright install --with-deps chromium

      - name: Run production browser E2E
        run: corepack pnpm@11.21.0 test:web:e2e

      - name: Run quality gate
        run: corepack pnpm@11.21.0 run check

  release-smoke:
    needs:
      - architecture
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            nodeVersion: 24.18.0
          - os: ubuntu-latest
            label: linux-x64
            nodeVersion: 24
          - os: macos-14
            label: macos-arm64
            nodeVersion: 24
          - os: macos-15-intel
            label: macos-x64
            nodeVersion: 24
    runs-on: ${{ matrix.os }}
    name: release-smoke (${{ matrix.label }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodeVersion }}
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm@11.21.0 install --frozen-lockfile

      - name: Run source verification
        run: |
          corepack pnpm@11.21.0 check:architecture
          corepack pnpm@11.21.0 lint
          corepack pnpm@11.21.0 typecheck
          corepack pnpm@11.21.0 test
          corepack pnpm@11.21.0 build

      - name: Build platform release artifact
        run: corepack pnpm@11.21.0 build:release

      - name: Run artifact-only E2E
        run: corepack pnpm@11.21.0 test:release

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: caelush-${{ matrix.label }}
          path: release-artifacts/*
          if-no-files-found: error
